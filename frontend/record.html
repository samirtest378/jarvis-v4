<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>JARVIS orb recorder</title>
    <style>
      html, body { margin: 0; background: #050508; color: #9fdcf5; font: 13px -apple-system, system-ui, sans-serif; }
      #log { position: fixed; top: 8px; left: 8px; z-index: 2; white-space: pre; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <!-- Development-only page. It drives the real orb animation frame by frame
         and records it, so the shipped video is the genuine article rather than
         a lookalike. Never included in a build; `npm run build` only emits
         index.html. -->
    <div id="log">idle</div>
    <canvas id="orb-canvas"></canvas>
    <script type="module" src="/src/record.ts"></script>
  </body>
</html>
