  <rect width="1024" height="1024" rx="226" fill="url(#tile)"/>
  <circle cx="512" cy="500" r="263" fill="#16bdea" opacity="0.12" filter="url(#glow)"/>
  <circle cx="512" cy="500" r="250" fill="url(#core)" stroke="#4ad6ff" stroke-opacity="0.54" stroke-width="5"/>
  <g clip-path="url(#sphere)" fill="none" stroke-linecap="round">
    <ellipse cx="512" cy="500" rx="147" ry="250" stroke="url(#ice)" stroke-width="7" stroke-opacity="0.82"/>
    <ellipse cx="512" cy="500" rx="219" ry="250" stroke="#45d2fb" stroke-width="4" stroke-opacity="0.25"/>
  </g>
  <ellipse cx="512" cy="520" rx="354" ry="102" fill="none" stroke="url(#ice)" stroke-width="9" filter="url(#glow)"/>
  <circle cx="512" cy="250" r="10" fill="#f4fdff" filter="url(#glow)"/>
  <circle cx="365" cy="520" r="9" fill="#f4fdff" filter="url(#glow)"/>
  <circle cx="512" cy="750" r="10" fill="#f4fdff" filter="url(#glow)"/>
