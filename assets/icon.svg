<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="tile" cx="50%" cy="42%" r="78%">
      <stop offset="0" stop-color="#0a2138"/>
      <stop offset="0.68" stop-color="#061425"/>
      <stop offset="1" stop-color="#020912"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="58%">
      <stop offset="0" stop-color="#f4fdff"/>
      <stop offset="0.09" stop-color="#a9efff"/>
      <stop offset="0.28" stop-color="#13bdeb"/>
      <stop offset="0.62" stop-color="#075487"/>
      <stop offset="1" stop-color="#031b35"/>
    </radialGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ecfdff"/>
