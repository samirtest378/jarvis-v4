name: Build JARVIS v4 installers

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: Build unsigned test artifacts or require signed sale artifacts
        required: true
        default: test
        type: choice
        options:
          - test
          - signed
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Windows x64 sale installer
    runs-on: windows-2025
    env:
      JARVIS_RELEASE_PLATFORM: windows
      VOICE_RELEASE_TAG: v4.1.1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.lock.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-build.lock.txt
          npm run setup

      - name: Prepare bundled offline speech recognition
        run: npm --prefix desktop run build:speech

      - name: Bundle the matching German and English JARVIS voice
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/installer-voice
          gh release download "$VOICE_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "JARVIS-v4-Smooth-Bilingual-Voice-4.1.1-win32-x64.jarvisvoice" \
            --dir build/installer-voice
          archive="$(find build/installer-voice -maxdepth 1 -name '*.jarvisvoice' -print -quit)"
          test -n "$archive"
          python scripts/stage_bundled_voice_pack.py \
            --archive "$archive" \
            --output desktop/bundled-voice-pack \
            --platform win32 \
            --arch x64

      - name: Verify source and tests
        run: |
          npm run release:audit
          npm run test:frontend
          npm run test:desktop
          python -m pytest -q

      - name: Require production signing inputs
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_mode == 'signed'
        run: node scripts/assert_signing_env.cjs

      - name: Build signed installer
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_mode == 'signed'
        env:
          # electron-builder consumes CSC_*. WIN_* is retained for the explicit
          # preflight gate, so both paths refer to the same Windows certificate.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm --prefix desktop run build -- --win -c.forceCodeSigning=true --publish never

      - name: Build unsigned test installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.release_mode != 'signed' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm --prefix desktop run build -- --win --publish never

      - name: Clean-install and launch the Windows app
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem release/JARVIS-v4-*.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one Windows installer, found $($installers.Count)" }
          $requireSignature = "${{ startsWith(github.ref, 'refs/tags/v') || inputs.release_mode == 'signed' }}" -eq "true"
          ./scripts/verify_windows_installer.ps1 -InstallerPath $installers[0].FullName -RequireSignature:$requireSignature

      - name: Create checksums
        run: python scripts/create_release_checksums.py

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-v4-windows-x64
          if-no-files-found: error
          compression-level: 0
          path: |
            release/JARVIS-v4-*.exe
            release/JARVIS-v4-*-SHA256SUMS.txt
