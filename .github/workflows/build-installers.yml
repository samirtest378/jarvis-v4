name: Build JARVIS v4 installers

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: Build unsigned test artifacts or require signed sale artifacts
        required: true
        default: test
        type: choice
        options:
          - test
          - signed
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            platform: macos
            voice_platform: darwin
            voice_arch: arm64
            builder: mac
            artifact: macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            platform: macos
            voice_platform: darwin
            voice_arch: x64
            builder: mac
            artifact: macos-x64
          - name: Windows x64
            os: windows-2025
            platform: windows
            voice_platform: win32
            voice_arch: x64
            builder: win
            artifact: windows-x64
          - name: Linux x64 AppImage
            os: ubuntu-24.04
            platform: linux
            voice_platform: linux
            voice_arch: x64
            builder: linux
            linux_target: AppImage
            artifact: linux-x64-appimage
          - name: Linux x64 DEB
            os: ubuntu-24.04
            platform: linux
            voice_platform: linux
            voice_arch: x64
            builder: linux
            linux_target: deb
            artifact: linux-x64-deb

    runs-on: ${{ matrix.os }}
    env:
      JARVIS_RELEASE_PLATFORM: ${{ matrix.platform }}
      VOICE_RELEASE_TAG: v4.1.1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.lock.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements-build.lock.txt
          npm run setup

      - name: Prepare bundled offline speech recognition
        run: npm --prefix desktop run build:speech

      - name: Bundle the matching German and English JARVIS voice
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build/installer-voice
          gh release download "$VOICE_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "JARVIS-v4-Smooth-Bilingual-Voice-4.1.1-${{ matrix.voice_platform }}-${{ matrix.voice_arch }}.jarvisvoice" \
            --dir build/installer-voice
          archive="$(find build/installer-voice -maxdepth 1 -name '*.jarvisvoice' -print -quit)"
          test -n "$archive"
          python scripts/stage_bundled_voice_pack.py \
            --archive "$archive" \
            --output desktop/bundled-voice-pack \
            --platform "${{ matrix.voice_platform }}" \
            --arch "${{ matrix.voice_arch }}"

      - name: Verify source and tests
        run: |
          npm run release:audit
          npm run test:frontend
          npm run test:desktop
          python -m pytest -q

      - name: Require production signing inputs
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_mode == 'signed'
        run: node scripts/assert_signing_env.cjs

      - name: Build signed installer
        if: matrix.platform != 'linux' && (startsWith(github.ref, 'refs/tags/v') || inputs.release_mode == 'signed')
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm --prefix desktop run build -- --${{ matrix.builder }} -c.forceCodeSigning=true --publish never

      - name: Build Linux packages
        if: matrix.platform == 'linux'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm --prefix desktop run build -- --linux ${{ matrix.linux_target }} --publish never

      - name: Build unsigned test installer
        if: ${{ matrix.platform != 'linux' && !startsWith(github.ref, 'refs/tags/v') && inputs.release_mode != 'signed' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm --prefix desktop run build -- --${{ matrix.builder }} --publish never

      - name: Create checksums
        run: python scripts/create_release_checksums.py

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-v4-${{ matrix.artifact }}
          if-no-files-found: error
          compression-level: 0
          path: |
            release/JARVIS-v4-*.dmg
            release/JARVIS-v4-*.zip
            release/JARVIS-v4-*.exe
            release/JARVIS-v4-*.AppImage
            release/JARVIS-v4-*.deb
            release/JARVIS-v4-*-SHA256SUMS.txt
